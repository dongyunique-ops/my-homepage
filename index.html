<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Motion Lab</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Text Motion Lab</div>
        </nav>
    </header>

    <main>
        <!-- Tab Selector -->
        <div class="tab-container">
            <button class="tab active" data-tab="text">텍스트 입력</button>
            <button class="tab" data-tab="image">이미지에서 추출</button>
        </div>

        <!-- Tab 1: Text Input -->
        <section class="panel active" id="panel-text">
            <textarea id="textInput" placeholder="여기에 텍스트를 입력하세요...">배달의민족 텍스트 모션</textarea>
        </section>

        <!-- Tab 2: Image OCR -->
        <section class="panel" id="panel-image">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📷</div>
                <p class="upload-text">이미지를 드래그하거나 클릭해서 업로드</p>
                <p class="upload-hint">텍스트가 포함된 이미지를 넣어주세요</p>
                <input type="file" id="imageInput" accept="image/*" hidden>
            </div>
            <div class="image-preview" id="imagePreview" style="display:none;">
                <img id="previewImg" alt="업로드 이미지">
                <button class="remove-img-btn" id="removeImg">✕</button>
            </div>
            <div class="ocr-progress" id="ocrProgress" style="display:none;">
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <p class="progress-text" id="progressText">텍스트 인식 중...</p>
            </div>
            <div class="ocr-result" id="ocrResult" style="display:none;">
                <label class="field-label">추출된 텍스트 <span class="edit-hint">(수정 가능)</span></label>
                <textarea id="ocrText"></textarea>
            </div>
        </section>

        <!-- Controls -->
        <div class="controls">
            <div class="control-row">
                <div class="control-group">
                    <label>폰트</label>
                    <select id="fontSelect">
                        <option value="font-dohyun">도현체</option>
                        <option value="font-jua">주아체</option>
                        <option value="font-hanna">한나체</option>
                        <option value="font-euljiro">을지로체</option>
                        <option value="font-yeonsung">연성체</option>
                        <option value="font-kiranghaerang">기랑해랑체</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>모션</label>
                    <select id="motionSelect">
                        <optgroup label="등장">
                            <option value="fade-in">Fade In</option>
                            <option value="fade-in-up">Fade In Up</option>
                            <option value="fade-in-scale">Fade In Scale</option>
                            <option value="slide-left">Slide Left</option>
                            <option value="slide-right">Slide Right</option>
                            <option value="blur-reveal">Blur Reveal</option>
                            <option value="drop-in">Drop In</option>
                        </optgroup>
                        <optgroup label="타이핑">
                            <option value="typing-effect">Typing</option>
                        </optgroup>
                        <optgroup label="글자별 모션">
                            <option value="bounce-effect">Bounce 통통</option>
                            <option value="wave-effect">Wave 물결</option>
                            <option value="rubber-band">Rubber Band 고무줄</option>
                            <option value="flip-effect">3D Flip 뒤집기</option>
                            <option value="jelly-effect">Jelly 젤리</option>
                            <option value="scatter-effect">Scatter 흩뿌리기</option>
                            <option value="spin-effect">Spin 회전</option>
                            <option value="pop-effect">Pop 팝</option>
                            <option value="swing-effect">Swing 흔들</option>
                            <option value="float-up">Float Up 떠오르기</option>
                            <option value="domino-effect">Domino 도미노</option>
                        </optgroup>
                        <optgroup label="루프 연출">
                            <option value="neon-effect">Neon 네온</option>
                            <option value="gradient-wave">Gradient 그라디언트</option>
                            <option value="shadow-dance">Shadow Dance 그림자춤</option>
                            <option value="pulse-effect">Pulse 맥박</option>
                            <option value="flicker-effect">Flicker 깜빡</option>
                            <option value="rainbow-effect">Rainbow 무지개</option>
                        </optgroup>
                        <optgroup label="액션">
                            <option value="glitch-effect">Glitch 글리치</option>
                            <option value="shake-effect">Shake 흔들기</option>
                            <option value="explode-effect">Explode 폭발</option>
                            <option value="zoom-effect">Zoom 줌</option>
                        </optgroup>
                    </select>
                </div>
                <div class="control-group">
                    <label>크기</label>
                    <input type="range" id="fontSizeRange" min="1.5" max="6" step="0.5" value="3">
                    <span id="fontSizeValue">3rem</span>
                </div>
            </div>
            <button class="apply-btn" id="applyMotion">모션 적용</button>
        </div>

        <!-- Preview Stage -->
        <div class="stage-container">
            <div class="preview-stage" id="previewStage">
                <p class="stage-placeholder">위에서 텍스트를 입력하고 모션을 적용해보세요</p>
            </div>
            <button class="replay-btn" id="replayBtn" style="display:none;">다시 재생</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Text Motion Lab. 배달의민족 폰트 by 우아한형제들</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
