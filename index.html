<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Motion Lab</title>
    <link rel="stylesheet" href="style.css?v=8">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Text Motion Lab</div>
        </nav>
    </header>

    <main>
        <!-- Tab Selector -->
        <div class="tab-container">
            <button class="tab active" data-tab="text">텍스트 입력</button>
            <button class="tab" data-tab="image">이미지에서 추출</button>
            <button class="tab" data-tab="masking">마스킹</button>
        </div>

        <!-- Tab 1: Text Input -->
        <section class="panel active" id="panel-text">
            <textarea id="textInput" placeholder="여기에 텍스트를 입력하세요...">배달의민족 텍스트 모션</textarea>
        </section>

        <!-- Tab 2: Image OCR -->
        <section class="panel" id="panel-image">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📷</div>
                <p class="upload-text">이미지를 드래그하거나 클릭해서 업로드</p>
                <p class="upload-hint">텍스트가 포함된 이미지를 넣어주세요</p>
                <input type="file" id="imageInput" accept="image/*" hidden>
            </div>
            <div class="image-preview" id="imagePreview" style="display:none;">
                <img id="previewImg" alt="업로드 이미지">
                <button class="remove-img-btn" id="removeImg">✕</button>
            </div>
            <div class="ocr-progress" id="ocrProgress" style="display:none;">
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <p class="progress-text" id="progressText">텍스트 인식 중...</p>
            </div>
            <div class="ocr-result" id="ocrResult" style="display:none;">
                <label class="field-label">추출된 텍스트 <span class="edit-hint">(수정 가능)</span></label>
                <textarea id="ocrText"></textarea>
            </div>
        </section>

        <!-- Font & Size -->
        <div class="controls-top">
            <div class="control-group">
                <label>폰트</label>
                <select id="fontSelect">
                    <option value="font-work">배민 워크체</option>
                </select>
            </div>
            <div class="control-group">
                <label>크기</label>
                <input type="range" id="fontSizeRange" min="1.5" max="6" step="0.5" value="3">
                <span id="fontSizeValue">3rem</span>
            </div>
        </div>

        <!-- Motion Grid -->
        <div class="motion-section-label">모션 선택</div>
        <div class="motion-grid" id="motionGrid"></div>

        <!-- Detail Controls (shown when motion selected) -->
        <div class="detail-panel" id="detailPanel" style="display:none;">
            <div class="detail-header">
                <span class="detail-title" id="detailTitle">모션 설정</span>
                <button class="detail-close" id="detailClose">✕</button>
            </div>
            <div class="detail-controls" id="detailControls"></div>
            <button class="apply-btn" id="applyMotion">모션 적용</button>
        </div>

        <!-- Preview Stage -->
        <div class="stage-container">
            <div class="preview-stage" id="previewStage">
                <p class="stage-placeholder">모션을 선택하면 여기에서 미리볼 수 있어요</p>
            </div>
            <div class="stage-actions">
                <button class="replay-btn" id="replayBtn" style="display:none;">다시 재생</button>
                <button class="export-btn" id="exportBtn" style="display:none;">MP4 내보내기 (그린스크린)</button>
            </div>
        </div>

        <!-- Masking Panel -->
        <div class="masking-section" id="maskingSection" style="display:none;">
            <div class="detail-header">
                <span class="detail-title">마스킹 애니메이션</span>
                <button class="detail-close" id="maskingClose">✕</button>
            </div>
            <p class="masking-desc">텍스트의 일부를 선택해서 지워졌다 나타나는 효과를 줍니다</p>
            <div class="masking-input-wrap">
                <label class="field-label">텍스트 (드래그로 마스킹 영역 선택)</label>
                <div class="masking-text" id="maskingText" contenteditable="false"></div>
            </div>
            <div class="masking-controls" id="maskingControls">
                <div class="ctrl">
                    <label>마스킹 시작 시간</label>
                    <input type="range" id="maskStart" min="0" max="3" step="0.1" value="0">
                    <div class="val" id="maskStartVal">0s</div>
                </div>
                <div class="ctrl">
                    <label>사라짐 지속시간</label>
                    <input type="range" id="maskHideDur" min="0.1" max="2" step="0.1" value="0.5">
                    <div class="val" id="maskHideDurVal">0.5s</div>
                </div>
                <div class="ctrl">
                    <label>숨김 유지시간</label>
                    <input type="range" id="maskHold" min="0" max="3" step="0.1" value="1">
                    <div class="val" id="maskHoldVal">1s</div>
                </div>
                <div class="ctrl">
                    <label>나타남 지속시간</label>
                    <input type="range" id="maskShowDur" min="0.1" max="2" step="0.1" value="0.5">
                    <div class="val" id="maskShowDurVal">0.5s</div>
                </div>
                <div class="ctrl">
                    <label>효과 스타일</label>
                    <select id="maskStyle">
                        <option value="opacity">투명도</option>
                        <option value="blur">블러</option>
                        <option value="scale">축소</option>
                        <option value="slide-up">위로 슬라이드</option>
                        <option value="clip">클리핑</option>
                        <option value="glitch">글리치</option>
                    </select>
                </div>
                <div class="ctrl">
                    <label>이징</label>
                    <select id="maskEasing">
                        <option value="ease">Ease</option>
                        <option value="ease-in-out">Ease In-Out</option>
                        <option value="ease-in">Ease In</option>
                        <option value="ease-out">Ease Out</option>
                        <option value="linear">Linear</option>
                    </select>
                </div>
            </div>
            <button class="apply-btn" id="applyMasking">마스킹 미리보기</button>
            <div class="masking-preview" id="maskingPreview"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Text Motion Lab. 배달의민족 폰트 by 우아한형제들</p>
    </footer>

    <script src="script.js?v=8"></script>
</body>
</html>
