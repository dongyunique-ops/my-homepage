<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Motion Lab</title>
    <link rel="stylesheet" href="style.css?v=18">
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Text Motion Lab</div>
        </nav>
    </header>

    <main>
        <!-- Tab Selector -->
        <div class="tab-container">
            <button class="tab active" data-tab="text">텍스트 입력</button>
            <button class="tab" data-tab="image">이미지 모션</button>
            <button class="tab" data-tab="compose">컴포지션</button>
        </div>

        <!-- Tab 1: Text Input -->
        <section class="panel active" id="panel-text">
            <textarea id="textInput" placeholder="여기에 텍스트를 입력하세요...">배달의민족 텍스트 모션</textarea>
        </section>

        <!-- Tab 2: Image Motion -->
        <section class="panel" id="panel-image">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">🖼️</div>
                <p class="upload-text">텍스트 이미지를 드래그하거나 클릭해서 업로드</p>
                <p class="upload-hint">이미지에 직접 모션을 적용합니다</p>
                <input type="file" id="imageInput" accept="image/*" hidden>
            </div>
            <div class="image-preview" id="imagePreview" style="display:none;">
                <img id="previewImg" alt="업로드 이미지">
                <button class="remove-img-btn" id="removeImg">✕</button>
            </div>
        </section>

        <!-- Font & Size -->
        <div class="controls-top">
            <div class="control-group">
                <label>폰트</label>
                <select id="fontSelect">
                    <option value="font-work">배민 워크체</option>
                </select>
            </div>
            <div class="control-group">
                <label>크기</label>
                <input type="range" id="fontSizeRange" min="1.5" max="6" step="0.5" value="3">
                <span id="fontSizeValue">3rem</span>
            </div>
        </div>

        <!-- Motion Grid -->
        <div class="motion-section-label">모션 선택</div>
        <div class="motion-grid" id="motionGrid"></div>

        <!-- Detail Controls (shown when motion selected) -->
        <div class="detail-panel" id="detailPanel" style="display:none;">
            <div class="detail-header">
                <span class="detail-title" id="detailTitle">모션 설정</span>
                <button class="detail-close" id="detailClose">✕</button>
            </div>
            <div class="detail-controls" id="detailControls"></div>
            <button class="apply-btn" id="applyMotion">모션 적용</button>
        </div>

        <!-- Preview Stage -->
        <div class="stage-container">
            <div class="preview-stage" id="previewStage">
                <p class="stage-placeholder">모션을 선택하면 여기에서 미리볼 수 있어요</p>
            </div>
            <div class="stage-actions">
                <button class="replay-btn" id="replayBtn" style="display:none;">다시 재생</button>
                <button class="export-btn" id="exportBtn" style="display:none;">MP4 내보내기 (그린스크린)</button>
            </div>
        </div>

        <!-- Composition Panel -->
        <section class="panel" id="panel-compose">
            <div class="compose-editor">
                <div class="compose-section">
                    <label class="field-label">이미지</label>
                    <div class="compose-upload" id="composeUpload">
                        <span>+ 이미지 추가</span>
                        <input type="file" id="composeImageInput" accept="image/*" hidden>
                    </div>
                    <div class="compose-img-preview" id="composeImgPreview" style="display:none;">
                        <img id="composeImg" alt="">
                        <button class="remove-img-btn" id="composeImgRemove">✕</button>
                    </div>
                    <div class="compose-controls">
                        <div class="ctrl"><label>X 위치</label><input type="range" id="imgX" min="-50" max="100" value="50"><div class="val" id="imgXVal">50%</div></div>
                        <div class="ctrl"><label>Y 위치</label><input type="range" id="imgY" min="-50" max="100" value="30"><div class="val" id="imgYVal">30%</div></div>
                        <div class="ctrl"><label>크기</label><input type="range" id="imgScale" min="10" max="200" value="80"><div class="val" id="imgScaleVal">80%</div></div>
                    </div>
                </div>
                <div class="compose-section">
                    <label class="field-label">텍스트</label>
                    <input type="text" id="composeText" class="compose-text-input" placeholder="텍스트 입력..." value="배달의민족">
                    <div class="compose-controls">
                        <div class="ctrl"><label>X 위치</label><input type="range" id="txtX" min="0" max="100" value="50"><div class="val" id="txtXVal">50%</div></div>
                        <div class="ctrl"><label>Y 위치</label><input type="range" id="txtY" min="0" max="100" value="70"><div class="val" id="txtYVal">70%</div></div>
                        <div class="ctrl"><label>크기</label><input type="range" id="txtSize" min="1" max="8" step="0.5" value="3"><div class="val" id="txtSizeVal">3rem</div></div>
                        <div class="ctrl"><label>색상</label><input type="color" id="txtColor" value="#ffffff"></div>
                    </div>
                </div>
            </div>
            <div class="compose-preview" id="composePreview">
                <p class="stage-placeholder">이미지와 텍스트를 추가하세요</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Text Motion Lab. 배달의민족 폰트 by 우아한형제들</p>
    </footer>

    <script src="script.js?v=18"></script>
</body>
</html>
