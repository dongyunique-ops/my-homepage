<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Motion Lab</title>
    <link rel="stylesheet" href="style.css?v=19">    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Text Motion Lab</div>
        </nav>
    </header>

    <main>
        <!-- Tab Selector -->
        <div class="tab-container">
            <button class="tab active" data-tab="text">텍스트 입력</button>
            <button class="tab" data-tab="image">이미지 모션</button>
            <button class="tab" data-tab="compose">컴포지션</button>
        </div>

        <!-- Tab 1: Text Input -->
        <section class="panel active" id="panel-text">
            <textarea id="textInput" placeholder="여기에 텍스트를 입력하세요...">배달의민족 텍스트 모션</textarea>
        </section>

        <!-- Tab 2: Image Motion -->
        <section class="panel" id="panel-image">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">🖼️</div>
                <p class="upload-text">텍스트 이미지를 드래그하거나 클릭해서 업로드</p>
                <p class="upload-hint">이미지에 직접 모션을 적용합니다</p>
                <input type="file" id="imageInput" accept="image/*" hidden>
            </div>
            <div class="image-preview" id="imagePreview" style="display:none;">
                <img id="previewImg" alt="업로드 이미지">
                <button class="remove-img-btn" id="removeImg">✕</button>
            </div>
        </section>

        <!-- Font & Size -->
        <div class="controls-top">
            <div class="control-group">
                <label>폰트</label>
                <select id="fontSelect">
                    <option value="font-work">배민 워크체</option>
                </select>
            </div>
            <div class="control-group">
                <label>크기</label>
                <input type="range" id="fontSizeRange" min="1.5" max="6" step="0.5" value="3">
                <span id="fontSizeValue">3rem</span>
            </div>
        </div>

        <!-- Motion Grid -->
        <div class="motion-section-label">모션 선택</div>
        <div class="motion-grid" id="motionGrid"></div>

        <!-- Detail Controls (shown when motion selected) -->
        <div class="detail-panel" id="detailPanel" style="display:none;">
            <div class="detail-header">
                <span class="detail-title" id="detailTitle">모션 설정</span>
                <button class="detail-close" id="detailClose">✕</button>
            </div>
            <div class="detail-controls" id="detailControls"></div>
            <button class="apply-btn" id="applyMotion">모션 적용</button>
        </div>

        <!-- Preview Stage -->
        <div class="stage-container">
            <div class="preview-stage" id="previewStage">
                <p class="stage-placeholder">모션을 선택하면 여기에서 미리볼 수 있어요</p>
            </div>
            <div class="stage-actions">
                <button class="replay-btn" id="replayBtn" style="display:none;">다시 재생</button>
                <button class="export-btn" id="exportBtn" style="display:none;">MP4 내보내기 (그린스크린)</button>
            </div>
        </div>

        <!-- Composition Panel -->
        <section class="panel" id="panel-compose">
            <div class="canvas-toolbar">
                <button class="toolbar-btn" id="canvasAddImg">🖼️ 이미지 추가</button>
                <button class="toolbar-btn" id="canvasAddTxt">T 텍스트 추가</button>
                <input type="file" id="canvasImgInput" accept="image/*" hidden>
            </div>
            <div class="canvas-stage" id="canvasStage">
                <p class="stage-placeholder" id="canvasPlaceholder">이미지나 텍스트를 추가하세요</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Text Motion Lab. 배달의민족 폰트 by 우아한형제들</p>
    </footer>

    <script src="script.js?v=20"></script>
</body>
</html>
